# 模型与运行配置（方案 v1.3 第七节）
# run 命令：boltcheck run --model <模型名> --profile <配置名> --group <组>
# params 会原样放进 OpenAI 兼容接口的请求体（vLLM 支持 top_k、chat_template_kwargs 等扩展字段）。
#
# 部署约束：推理服务显存 3～5GB。每个模型对应的 vllm serve 命令见 docs/running.md。
# hf_repo / quantization 只用于记录（写入 meta.json），实际加载哪个模型由 vllm serve 决定。

# ---------- 采样配置 ----------

[profiles.greedy]
# 方案：非思考模式，温度 0，每条样本跑 1 次。
# enable_thinking = false 只对 Qwen3-1.7B 这类带思考开关的模型起作用，其他模型的模板会忽略它。
repeats = 1
seed = 1234
[profiles.greedy.params]
temperature = 0.0
max_tokens = 2048
chat_template_kwargs = { enable_thinking = false }

[profiles.greedy-json]
# 与 greedy 相同，另外打开结构化输出：按调用的组附上 JSON Schema（vLLM response_format json_schema），
# 保证输出是合法 JSON、cells 正好 64 格、写完即停。只约束格式，不影响内容；需要支持结构化输出的 vLLM 版本。
repeats = 1
seed = 1234
structured_output = true
[profiles.greedy-json.params]
temperature = 0.0
max_tokens = 2048
chat_template_kwargs = { enable_thinking = false }

[profiles.sampled]
# 备选：Qwen3 模型卡推荐的非思考采样参数（temperature 0.7、top_p 0.8、top_k 20），跑 3 次。
# 模型卡建议出现无限重复时加 presence_penalty；本任务要输出大量重复的数字和逗号，默认取 0，可作为消融项。
repeats = 3
seed = 1234
[profiles.sampled.params]
temperature = 0.7
top_p = 0.8
top_k = 20
min_p = 0.0
presence_penalty = 0.0
max_tokens = 2048
chat_template_kwargs = { enable_thinking = false }

[profiles.api]
# 大模型能力上限参考（方案 v1.12 第七节）：不指定温度，用各家默认值。
# 当前的旗舰模型大多是推理模型，Claude 4.7 起和部分推理模型不接受温度 0（会返回 400），因此各家统一不设。
# DeepSeek、GLM 默认开启思考；max_tokens 含思考过程，取得较大以免截断，按实际输出计费。
repeats = 1
[profiles.api.params]
max_tokens = 32768

[profiles.api-nothink]
# 对照：关闭思考（DeepSeek、GLM 都用 thinking.type = disabled），与本地非思考模式更可比。
repeats = 1
[profiles.api-nothink.params]
max_tokens = 8192
thinking = { type = "disabled" }

[profiles.thinking]
# 思考模式：Qwen3 模型卡推荐参数（temperature 0.6、top_p 0.95、top_k 20，不用贪心解码），跑 3 次。
repeats = 3
seed = 1234
[profiles.thinking.params]
temperature = 0.6
top_p = 0.95
top_k = 20
min_p = 0.0
presence_penalty = 0.0
max_tokens = 16384
chat_template_kwargs = { enable_thinking = true }

[profiles.thinking-once]
# 思考模式只跑 1 次（10 条试看用，耗时约为 thinking 的三分之一），参数同 thinking。
repeats = 1
seed = 1234
[profiles.thinking-once.params]
temperature = 0.6
top_p = 0.95
top_k = 20
min_p = 0.0
presence_penalty = 0.0
max_tokens = 16384
chat_template_kwargs = { enable_thinking = true }

# ---------- 模型 ----------
# 一次只起一个本地模型，所有本地模型共用 8000 端口；model 必须与 vllm serve 的 --served-model-name 一致。

[models."qwen3-4b-instruct-2507-int4"]
# 本地主测，预估约 4～4.5GB
base_url = "http://localhost:8000/v1"
model = "qwen3-4b-instruct-2507-int4"
hf_repo = "cyankiwi/Qwen3-4B-Instruct-2507-AWQ-4bit"
quantization = "INT4 AWQ（W4A16，社区量化版）"
api_key_env = ""
timeout_s = 600
profiles = ["greedy", "greedy-json", "sampled"]

[models."qwen3-4b-thinking-2507-int4"]
# 与主测同尺寸的思考版（Qwen3-4B-Instruct-2507 本身没有思考模式，思考版是单独发布的 Qwen3-4B-Thinking-2507）。
# 只工作在思考模式；思考很长，上下文开到 20480，KV 缓存更大，显存预计约 5.5～6.5GB，可能超出 3～5GB 目标。
base_url = "http://localhost:8000/v1"
model = "qwen3-4b-thinking-2507-int4"
hf_repo = "cpatonn/Qwen3-4B-Thinking-2507-AWQ-4bit"
quantization = "INT4 AWQ（W4A16，社区量化版）"
api_key_env = ""
timeout_s = 1800
profiles = ["thinking-once", "thinking"]

[models."phi-4-mini-instruct-int4"]
# 跨家族对比，预估约 4～4.5GB
base_url = "http://localhost:8000/v1"
model = "phi-4-mini-instruct-int4"
hf_repo = "microsoft/Phi-4-mini-instruct"
quantization = "INT4 bitsandbytes（vLLM 加载时量化）"
api_key_env = ""
timeout_s = 600
profiles = ["greedy", "greedy-json", "sampled"]

[models."qwen3-1.7b-int8"]
# 低配档与思考模式对比；同一个服务既能跑非思考（greedy / sampled）也能跑思考（thinking）
base_url = "http://localhost:8000/v1"
model = "qwen3-1.7b-int8"
hf_repo = "Qwen/Qwen3-1.7B-GPTQ-Int8"
quantization = "INT8 GPTQ（官方量化版）"
api_key_env = ""
timeout_s = 1200
profiles = ["greedy", "greedy-json", "sampled", "thinking"]

[models."qwen3-1.7b-bf16"]
# 可选：量化影响对照，与 qwen3-1.7b-int8 比较；只跑非思考模式，预估约 4.5GB
base_url = "http://localhost:8000/v1"
model = "qwen3-1.7b-bf16"
hf_repo = "Qwen/Qwen3-1.7B"
quantization = "BF16（原精度）"
api_key_env = ""
timeout_s = 600
profiles = ["greedy", "greedy-json", "sampled"]

# ---------- 大模型能力上限参考（远程 API，方案 v1.12） ----------
# 都走各家的 OpenAI 兼容接口，密钥放在环境变量里（不要写进本文件）。模型名以各家文档为准，可直接改 model。
# 远程 API 不认识 vLLM 的扩展字段，发送前去掉；seed 各家支持不一，也去掉（温度用默认值，seed 意义不大）。

[models.claude-opus]
# Anthropic，OpenAI SDK 兼容层：https://platform.claude.com/docs/en/cli-sdks-libraries/libraries/openai-sdk
# Claude 4.7 起的模型不接受小于 1 的 temperature 和 top_p，api 配置已不设；Claude 5 系列默认开启自适应思考。
base_url = "https://api.anthropic.com/v1"
model = "claude-opus-5-5"
api_key_env = "ANTHROPIC_API_KEY"
timeout_s = 900
profiles = ["api"]
drop_params = ["chat_template_kwargs", "top_k", "min_p", "seed"]

[models.gpt]
# OpenAI：https://developers.openai.com/api/reference/resources/chat/subresources/completions/methods/create
# 新模型用 max_completion_tokens（含推理 token）。文档示例为 gpt-6-astra，也可换成 gpt-6.1-sol 等。
base_url = "https://api.openai.com/v1"
model = "gpt-6-astra"
api_key_env = "OPENAI_API_KEY"
timeout_s = 900
profiles = ["api"]
drop_params = ["chat_template_kwargs", "top_k", "min_p", "seed"]
rename_params = { max_tokens = "max_completion_tokens" }

[models.gemini]
# Google，OpenAI 兼容接口：https://ai.google.dev/gemini-api/docs/openai
# Gemini 3 系列的思考无法关闭。gemini-3.1-pro-preview 为模型列表中的 Pro 型号；也可换成文档首页的新旗舰。
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
model = "gemini-3.1-pro-preview"
api_key_env = "GEMINI_API_KEY"
timeout_s = 900
profiles = ["api"]
drop_params = ["chat_template_kwargs", "top_k", "min_p", "seed"]

[models.deepseek]
# DeepSeek（OpenAI 兼容）：https://api-docs.deepseek.com/api/create-chat-completion/
# 可用模型 deepseek-v4-pro、deepseek-flash；未指定 thinking 时默认开启思考。旧名 deepseek-chat / deepseek-reasoner 已停用。
base_url = "https://api.deepseek.com"
model = "deepseek-v4-pro"
api_key_env = "DEEPSEEK_API_KEY"
timeout_s = 1800
profiles = ["api", "api-nothink"]
drop_params = ["chat_template_kwargs", "top_k", "min_p", "seed"]

[models.deepseek-flash]
base_url = "https://api.deepseek.com"
model = "deepseek-flash"
api_key_env = "DEEPSEEK_API_KEY"
vision = true
timeout_s = 900
profiles = ["api", "api-nothink"]
drop_params = ["chat_template_kwargs", "top_k", "min_p", "seed"]

[models.qwen3-vl-plus]
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
model = "qwen3-vl-plus"
api_key_env = "DASHSCOPE_API_KEY"
vision = true
timeout_s = 600
profiles = ["api"]
drop_params = ["chat_template_kwargs", "top_k", "min_p", "seed"]

[models.qwen3-vl-flash]
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
model = "qwen3-vl-flash"
api_key_env = "DASHSCOPE_API_KEY"
vision = true
timeout_s = 600
profiles = ["api"]
drop_params = ["chat_template_kwargs", "top_k", "min_p", "seed"]

[models.glm]
# 智谱 GLM（OpenAI 兼容）：https://docs.bigmodel.cn/cn/guide/develop/openai/introduction
# 国内端点 open.bigmodel.cn；海外账号可改为 https://api.z.ai/api/paas/v4 。
# glm-5.3 为官方接口文档中的示例模型，也可改成 glm-5.2 等；GLM 用 thinking.type 开关思考，默认开启。
base_url = "https://open.bigmodel.cn/api/paas/v4"
model = "glm-5.3"
api_key_env = "ZAI_API_KEY"
timeout_s = 1800
profiles = ["api", "api-nothink"]
drop_params = ["chat_template_kwargs", "top_k", "min_p", "seed"]
