# 模型与运行配置（方案 v1.2 第七节）
# run 命令：boltcheck run --model <模型名> --profile <配置名> --group <组>
# params 会原样放进 OpenAI 兼容接口的请求体（vLLM 支持 top_k 等扩展字段）。
#
# Qwen3-VL 的 Instruct 版本没有思考开关，思考模式是单独的 Thinking 模型，
# 因此"思考模式开 / 关"对比通过换模型实现：2B-Instruct 对比 2B-Thinking。

# ---------- 采样配置 ----------

[profiles.greedy]
# 方案：非思考模式温度 0，每条样本跑 1 次。
# 注意：Qwen3-VL 模型卡的推荐配置都不使用贪心解码；若试跑出现大量重复或截断，
# 改用 instruct-sampled，并在实验日志中注明。
repeats = 1
seed = 1234
[profiles.greedy.params]
temperature = 0.0
max_tokens = 2048

[profiles.instruct-sampled]
# 备选：Qwen3-VL Instruct 模型卡的纯文本采样参数（temperature 1.0、top_p 1.0、top_k 40），跑 3 次。
# 模型卡纯文本建议 presence_penalty = 2.0；本任务要输出大量重复的数字和逗号，默认取 0，可作为消融项。
repeats = 3
seed = 3407
[profiles.instruct-sampled.params]
temperature = 1.0
top_p = 1.0
top_k = 40
presence_penalty = 0.0
max_tokens = 2048

[profiles.thinking]
# 思考模型：Qwen3-VL 官方评测中 Thinking 模型的采样参数，每条样本跑 3 次。
repeats = 3
seed = 1234
[profiles.thinking.params]
temperature = 0.6
top_p = 0.95
top_k = 20
presence_penalty = 0.0
max_tokens = 16384

# ---------- 模型 ----------
# 8GB 显存一次只起一个本地模型，所以两个本地模型共用同一个端口。

[models."qwen3-vl-2b-instruct"]
# 本地主测
base_url = "http://localhost:8000/v1"
model = "qwen3-vl-2b-instruct"      # 与 vllm serve 的 --served-model-name 保持一致
api_key_env = ""                    # 本地 vLLM 不需要密钥
timeout_s = 600
profiles = ["greedy", "instruct-sampled"]

[models."qwen3-vl-2b-thinking"]
# 思考模式对比；vllm serve 时加 --reasoning-parser qwen3
base_url = "http://localhost:8000/v1"
model = "qwen3-vl-2b-thinking"
api_key_env = ""
timeout_s = 1200
profiles = ["thinking"]

[models.api-reference]
# 能力上限参考（型号待定）。填好 base_url 和 model，并设置环境变量 LLM_API_KEY。
base_url = "https://api.example.com/v1"
model = "待定"
api_key_env = "LLM_API_KEY"
timeout_s = 900
# 远程 API 通常不认识 vLLM 的扩展字段，发送前去掉
drop_params = ["top_k"]
