# 自动试跑清单（代码 0.8.0 起）。本地定时任务在 main 更新后执行：
#   boltcheck pilot --gpu-monitor
# 即按顺序跑完下面各项并逐项评测；归档方式不变（每个运行目录一个 Release ZIP，可合并为一个 exp PR）。
# 本文件由 Claude 根据最新试跑结果调整，每次调整写入 CHANGELOG；请不要在本地临时改动后再运行，以便前后试跑可比。
# 先运行 `boltcheck pilot --dry-run` 可以只看清单、不调用模型。

model = "qwen3-4b-instruct-2507-int4"
note = "自动试跑"

# 固定的 10 条试跑样本（方案 v1.13 起，与 configs/runs/ 中的 10 条清单相同）：合规、不合规各 5 条。
# 即数据集前 8 条加 0015、0019；前 5 条与此前 --limit 5 的试跑相同。
#   合规：0001 0002 0003 0004 0007
#   不合规：0005 整段提前·前段  0006 对调·前段·多处  0008 插入·后段·边界难例  0015 对调·后段·边界难例  0019 整段提前·后段
ids = ["v1.1-0001", "v1.1-0002", "v1.1-0003", "v1.1-0004", "v1.1-0005", "v1.1-0006", "v1.1-0007", "v1.1-0008", "v1.1-0015", "v1.1-0019"]

[[runs]]
group = "judge"
profile = "greedy"
purpose = "第4组给标准矩阵，单独检验判断：是否按行抄对区块、最大数是否取自所抄区块"

[[runs]]
group = "pipeline"
profile = "greedy"
purpose = "与此前试跑同设置，看提示词v1.5的判断阶段在模型自己复原的矩阵上的表现"

[[runs]]
group = "pipeline"
profile = "greedy-json"
purpose = "打开结构化输出，区分复原的格式问题与抄写问题；服务不支持时本项会失败，其余各项照常"
