name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装
        run: pip install -e ".[dev]"
      - name: 单元测试
        run: pytest -q
      - name: 校验数据集可复现
        run: boltcheck verify-data data/v1.1
      - name: 程序规则基线端到端
        run: boltcheck run --backend baseline --group joint --out /tmp/runs
      - name: 检查自动试跑清单
        run: boltcheck pilot --dry-run
