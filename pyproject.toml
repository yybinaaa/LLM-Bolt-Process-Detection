[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "boltcheck"
dynamic = ["version"]
description = "高强螺栓初拧顺序判断实验：数据生成、规则程序、大模型调用与评测"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  'tomli>=2.0; python_version < "3.11"',
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
boltcheck = "boltcheck.cli:main"

[tool.setuptools.dynamic]
version = { attr = "boltcheck.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
